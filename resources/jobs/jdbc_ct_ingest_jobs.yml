# JDBC Change Tracking ingest — two-level fan-out
#
# Job 1  j_ipac_jdbc_ct_controller
#   Discover changed databases/tables at a fixed ct_head, then fan out 1 job per database.
#
# Job 2  j_ipac_jdbc_ct_database_worker
#   Fan out 1 task per changed table (concurrency max 5), then database-level recon.
#
# Flow:
#   discover (fixed ct_head per DB)
#     -> for_each database (concurrency 5)
#          -> for_each table (concurrency 5)
#               JDBC extract + MERGE
#          -> recon_ready for database + ct_head
#          -> advance watermarks only after PASS

resources:
  jobs:
    jdbc_ct_controller:
      name: j_ipac_jdbc_ct_controller
      max_concurrent_runs: 1
      timeout_seconds: 0
      tags:
        bundle: ${var.job_tag}
        purpose: jdbc_ct_ingest
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      parameters:
        - name: poll_interval_sec
          default: ${var.poll_interval_sec}
        - name: max_database_concurrency
          default: ${var.max_database_concurrency}
        - name: max_table_concurrency
          default: ${var.max_table_concurrency}
        - name: uc_catalog
          default: ${var.uc_catalog}
        - name: ingest_metadata_database
          default: ${var.ingest_metadata_database}
        - name: uc_schema_suffix
          default: ${var.uc_schema_suffix}
      # Continuous jobs cannot have depends_on / for_each (Jobs API 400).
      # Paused schedule keeps the discover → fan-out DAG; unpause after deploy.
      schedule:
        quartz_cron_expression: "0 * * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: jdbc_controller
          new_cluster:
            spark_version: ${var.pipeline_spark_version}
            node_type_id: Standard_D16s_v3
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[16]
            data_security_mode: SINGLE_USER
            custom_tags:
              ResourceClass: SingleNode
              purpose: jdbc_ct_controller
      tasks:
        - task_key: discover_ct_groups
          job_cluster_key: jdbc_controller
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_discover.py
            base_parameters:
              poll_interval_sec: "{{job.parameters.poll_interval_sec}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"
              uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"

        - task_key: fanout_databases
          depends_on:
            - task_key: discover_ct_groups
          for_each_task:
            inputs: "{{tasks.discover_ct_groups.values.changed_databases}}"
            concurrency: 5
            task:
              task_key: run_database_worker
              run_job_task:
                job_id: ${resources.jobs.jdbc_ct_database_worker.id}
                job_parameters:
                  group_id: "{{input.group_id}}"
                  client_nm: "{{input.client_nm}}"
                  database_name: "{{input.database_name}}"
                  ct_head: "{{input.ct_head}}"
                  ct_watermark_before: "{{input.ct_watermark_before}}"
                  changed_tables_json: "{{input.changed_tables_json}}"
                  max_table_concurrency: "{{job.parameters.max_table_concurrency}}"
                  uc_catalog: "{{job.parameters.uc_catalog}}"
                  ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"
                  uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"

    jdbc_ct_database_worker:
      name: j_ipac_jdbc_ct_database_worker
      max_concurrent_runs: 8
      timeout_seconds: 7200
      tags:
        bundle: ${var.job_tag}
        purpose: jdbc_ct_ingest
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      parameters:
        - name: group_id
          default: ""
        - name: client_nm
          default: ""
        - name: database_name
          default: ""
        - name: ct_head
          default: "0"
        - name: ct_watermark_before
          default: "0"
        - name: changed_tables_json
          default: "[]"
        - name: max_table_concurrency
          default: ${var.max_table_concurrency}
        - name: uc_catalog
          default: ${var.uc_catalog}
        - name: ingest_metadata_database
          default: ${var.ingest_metadata_database}
        - name: uc_schema_suffix
          default: ${var.uc_schema_suffix}
      job_clusters:
        - job_cluster_key: jdbc_worker
          new_cluster:
            spark_version: ${var.pipeline_spark_version}
            node_type_id: Standard_D16s_v3
            driver_node_type_id: Standard_D8s_v3
            autoscale:
              min_workers: 1
              max_workers: 4
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.sql.shuffle.partitions: "8"
            custom_tags:
              purpose: jdbc_ct_database_worker
      tasks:
        - task_key: prepare_table_fanout
          job_cluster_key: jdbc_worker
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_prepare_tables.py
            base_parameters:
              group_id: "{{job.parameters.group_id}}"
              client_nm: "{{job.parameters.client_nm}}"
              database_name: "{{job.parameters.database_name}}"
              ct_head: "{{job.parameters.ct_head}}"
              changed_tables_json: "{{job.parameters.changed_tables_json}}"

        - task_key: fanout_tables
          depends_on:
            - task_key: prepare_table_fanout
          for_each_task:
            inputs: "{{tasks.prepare_table_fanout.values.tables}}"
            concurrency: 5
            task:
              task_key: ingest_one_table
              job_cluster_key: jdbc_worker
              notebook_task:
                notebook_path: ${workspace.file_path}/src/common/notebooks/jdbc_ct_ingest_table.py
                base_parameters:
                  group_id: "{{job.parameters.group_id}}"
                  client_nm: "{{job.parameters.client_nm}}"
                  database_name: "{{job.parameters.database_name}}"
                  ct_head: "{{job.parameters.ct_head}}"
                  table_nm: "{{input.table}}"
                  watermark_before: "{{input.watermark_before}}"
                  uc_catalog: "{{job.parameters.uc_catalog}}"
                  ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"
                  uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"

        - task_key: recon_database_group
          depends_on:
            - task_key: fanout_tables
          job_cluster_key: jdbc_worker
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_recon_database.py
            base_parameters:
              group_id: "{{job.parameters.group_id}}"
              client_nm: "{{job.parameters.client_nm}}"
              database_name: "{{job.parameters.database_name}}"
              ct_head: "{{job.parameters.ct_head}}"
              ct_watermark_before: "{{job.parameters.ct_watermark_before}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"

        - task_key: write_process_log
          depends_on:
            - task_key: recon_database_group
          job_cluster_key: jdbc_worker
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_process_log.py
            base_parameters:
              group_id: "{{job.parameters.group_id}}"
              client_nm: "{{job.parameters.client_nm}}"
              database_name: "{{job.parameters.database_name}}"
              ct_head: "{{job.parameters.ct_head}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"
