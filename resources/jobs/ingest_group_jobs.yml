# One continuous job per client job_group. Each task runs ct_client_ingest.py
# for one client and loops forever (poll CT every freq_run, MERGE changed tables).
# Tasks must mirror config/common/client.json entries with the same job_group.
# Continuous jobs do not allow depends_on, so client tasks stay independent.

resources:
  jobs:
    ingest_group_1:
      name: j_ipac_ingest_group_1
      max_concurrent_runs: 1
      timeout_seconds: 0
      tags:
        bundle: ${var.job_tag}
        purpose: jdbc_ct_ingest
        job_group: "1"
      permissions:
        - level: CAN_MANAGE
          group_name: ${var.grant_group}
      email_notifications:
        on_failure:
          - ${var.heartbeat_job_alert_mail}
      parameters:
        - name: freq_run
          default: ${var.freq_run_sec}
        - name: audit_freq
          default: ${var.audit_freq_sec}
        - name: full_recon
          default: ${var.full_recon_sec}
        - name: parallel_table_run
          default: ${var.parallel_table_run}
        - name: uc_catalog
          default: ${var.uc_catalog}
        - name: uc_schema_suffix
          default: ${var.uc_schema_suffix}
        - name: ingest_metadata_database
          default: ${var.ingest_metadata_database}
      continuous:
        pause_status: PAUSED
      job_clusters:
        - job_cluster_key: ingest_group_1
          new_cluster:
            spark_version: ${var.pipeline_spark_version}
            node_type_id: Standard_D16s_v3
            driver_node_type_id: Standard_D8s_v3
            autoscale:
              min_workers: 1
              max_workers: 4
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.scheduler.mode: FAIR
              spark.databricks.delta.optimizeWrite.enabled: "true"
              spark.sql.shuffle.partitions: "8"
            custom_tags:
              purpose: jdbc_ct_ingest
              job_group: "1"
      tasks:
        - task_key: ingest_15347
          job_cluster_key: ingest_group_1
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_client_ingest.py
            base_parameters:
              client_name: "15347"
              freq_run: "{{job.parameters.freq_run}}"
              parallel_table_run: "{{job.parameters.parallel_table_run}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"

        - task_key: ingest_15447
          job_cluster_key: ingest_group_1
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_client_ingest.py
            base_parameters:
              client_name: "15447"
              freq_run: "{{job.parameters.freq_run}}"
              parallel_table_run: "{{job.parameters.parallel_table_run}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"

        - task_key: audit_group_1
          job_cluster_key: ingest_group_1
          notebook_task:
            notebook_path: ${workspace.file_path}/src/common/notebooks/ct_group_audit.py
            base_parameters:
              job_group: "1"
              freq_run: "{{job.parameters.audit_freq}}"
              full_recon: "{{job.parameters.full_recon}}"
              parallel_table_run: "{{job.parameters.parallel_table_run}}"
              uc_catalog: "{{job.parameters.uc_catalog}}"
              uc_schema_suffix: "{{job.parameters.uc_schema_suffix}}"
              ingest_metadata_database: "{{job.parameters.ingest_metadata_database}}"
