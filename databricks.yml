# ingest — JDBC Change Tracking ingest (on-demand job clusters)
bundle:
  name: ingest
  engine: direct

sync:
  include:
    - src/common/notebooks/**
    - src/common/ops/**
    - src/sql/**
    - config/common/**

include:
  - resources/jobs/*.yml

variables:
  uc_catalog:
    default: dev7
  uc_schema_suffix:
    default: "_custom"
  ingest_metadata_database:
    default: ipac_common_metadata
  grant_group:
    default: ipacs_dev_team
  job_tag:
    default: ingest
  heartbeat_job_alert_mail:
    default: mukessingh@deloitte.com
  pipeline_spark_version:
    default: 15.4.x-scala2.12
  freq_run_sec:
    description: Seconds between CT polls in ct_client_ingest
    default: "10"
  audit_freq_sec:
    description: Seconds between lightweight completeness audits
    default: "15"
  full_recon_sec:
    description: Seconds between full SQL vs Delta COUNT(*) passes
    default: "3600"
  parallel_table_run:
    description: Tables merged in parallel per client notebook
    default: "5"

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Shared/ingest/dev
    variables:
      uc_catalog: dev7
      uc_schema_suffix: "_custom"
      ingest_metadata_database: ipac_common_metadata
      grant_group: ipacs_dev_team
      job_tag: ingest
      freq_run_sec: "10"
      audit_freq_sec: "15"
      full_recon_sec: "3600"
      parallel_table_run: "5"

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/ingest/prod
    variables:
      uc_catalog: dev7
      uc_schema_suffix: "_custom"
      ingest_metadata_database: ipac_common_metadata
      grant_group: ipacs_dev_team
      job_tag: ingest
      freq_run_sec: "10"
      audit_freq_sec: "15"
      full_recon_sec: "3600"
      parallel_table_run: "5"
